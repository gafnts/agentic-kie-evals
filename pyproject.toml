[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "agentic-kie-evals"
version = "0.1.0"
description = "Benchmarking single-pass and agentic extraction strategies across LLM providers on the Kleister NDA dataset"
readme = "README.md"
authors = [ { name = "Gabriel Fuentes", email = "gafnts@gmail.com" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.19",
  "pre-commit>=4.5",
  "pyproject-fmt>=2.21",
  "pytest>=9",
  "pytest-cov>=7",
  "pytest-timeout>=2.4",
  "ruff>=0.15",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/agentic_kie_evals" ]

[tool.uv]
link-mode = "copy"

[tool.ruff]
target-version = "py313"
src = [ "src" ]
lint.select = [ "B", "E4", "E7", "E9", "F", "G", "I", "N", "SIM", "UP" ]

[tool.mypy]
mypy_path = "src"
files = [ "src", "tests" ]
strict = true
overrides = [
  { module = "tests.*", disallow_untyped_defs = false, disallow_any_expr = false },
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "src" ]
ini_options.timeout = 120
ini_options.filterwarnings = [
  "ignore::DeprecationWarning:importlib._bootstrap",
]

[tool.coverage]
run.branch = true
run.source = [ "src" ]
report.fail_under = 95
report.show_missing = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
