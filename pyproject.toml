[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "agentic-kie-evals"
version = "0.1.0"
description = "Benchmarking single-pass and agentic extraction strategies across LLM providers on the Kleister NDA dataset"
readme = "README.md"
authors = [ { name = "Gabriel Fuentes", email = "gafnts@gmail.com" } ]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "agentic-kie[all]>=0.4.1",
  "altair>=6",
  "nda",
  "polars>=1.39.3",
  "rich>=14.3.3",
  "tiktoken>=0.12",
]

[dependency-groups]
dev = [
  "ipykernel>=7.2",
  "mypy>=1.19",
  "pre-commit>=4.5",
  "pyproject-fmt>=2.21",
  "python-dotenv>=1.2.2",
  "ruff>=0.15",
]

[tool.hatch]
build.targets.wheel.packages = [ "src/agentic_kie_evals" ]

[tool.uv]
sources.nda = { git = "https://github.com/gafnts/kleister-nda-preparation.git" }
link-mode = "copy"

[tool.ruff]
target-version = "py313"
src = [ "src" ]
lint.select = [ "B", "E4", "E7", "E9", "F", "G", "I", "N", "SIM", "UP" ]

[tool.mypy]
mypy_path = "src"
files = [ "src" ]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
